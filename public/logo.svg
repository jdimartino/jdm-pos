<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="url(#bg)"/>
  <!-- Subtle border -->
  <circle cx="128" cy="128" r="124" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
  <!-- JDM text -->
  <text x="128" y="115" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" fill="white" letter-spacing="4">JDM</text>
  <!-- POS text -->
  <text x="128" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="48" fill="url(#accent)" letter-spacing="12">POS</text>
  <!-- Subtle line separator -->
  <line x1="60" y1="125" x2="196" y2="125" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
</svg>
